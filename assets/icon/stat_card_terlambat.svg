<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 88" width="210" height="88">
  <defs>
    <!-- Soft Ambient Elevation Shadow -->
    <filter id="shadow-terlambat" x="-8%" y="-12%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
  </defs>

  <style>
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Card Background Surface -->
  <rect x="5" y="4" width="200" height="80" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow-terlambat)" />

  <!-- Squircle Container (Soft Tint) -->
  <rect x="16" y="16" width="48" height="48" rx="14" ry="14" fill="#FFF8E6" />

  <!-- Gojek Style: Symmetrical Solid Amber Circle -->
  <circle cx="40" cy="40" r="17" fill="#FF9800" />
  
  <!-- Symmetrical White Alarm Clock in Center -->
  <circle cx="40" cy="40" r="9.5" stroke="#FFFFFF" stroke-width="2.4" fill="none" />
  <line x1="40" y1="40" x2="40" y2="35" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
  <line x1="40" y1="40" x2="44.5" y2="40" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="40" cy="40" r="1.5" fill="#FFFFFF" />
  <!-- Symmetrical Bells -->
  <path d="M33 33l-2.2-2.2M47 33l2.2-2.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

  <!-- Number Value (0) -->
  <text x="78" y="41" class="font-inter" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.5">0</text>

  <!-- Label (TOTAL TERLAMBAT) -->
  <text x="78" y="59" class="font-inter" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.4">TOTAL TERLAMBAT</text>
</svg>
