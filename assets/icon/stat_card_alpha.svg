<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 88" width="210" height="88">
  <defs>
    <!-- Soft Ambient Elevation Shadow -->
    <filter id="shadow-alpha" x="-8%" y="-12%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ED2736" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
  </defs>

  <style>
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Card Background Surface (Rose Border Halus) -->
  <rect x="5" y="4" width="200" height="80" rx="16" ry="16" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.3" filter="url(#shadow-alpha)" />

  <!-- Squircle Container (Soft Tint) -->
  <rect x="16" y="16" width="48" height="48" rx="14" ry="14" fill="#FEECEE" />

  <!-- Gojek Style: Symmetrical Solid Red Circle -->
  <circle cx="40" cy="40" r="17" fill="#ED2736" />
  
  <!-- Bold White Cross with 100% Symmetry -->
  <line x1="34.5" y1="34.5" x2="45.5" y2="45.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  <line x1="45.5" y1="34.5" x2="34.5" y2="45.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />

  <!-- Number Value (0) -->
  <text x="78" y="41" class="font-inter" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.5">0</text>

  <!-- Label (TOTAL ALPHA) -->
  <text x="78" y="59" class="font-inter" font-size="11" font-weight="700" fill="#ED2736" letter-spacing="0.4">TOTAL ALPHA</text>
</svg>
