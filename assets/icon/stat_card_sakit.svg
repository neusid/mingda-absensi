<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 88" width="210" height="88">
  <defs>
    <!-- Soft Ambient Elevation Shadow -->
    <filter id="shadow-sakit" x="-8%" y="-12%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
  </defs>

  <style>
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Card Background Surface -->
  <rect x="5" y="4" width="200" height="80" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow-sakit)" />

  <!-- Squircle Container (Soft Tint) -->
  <rect x="16" y="16" width="48" height="48" rx="14" ry="14" fill="#FEEFEA" />

  <!-- Gojek Style: Symmetrical Solid Coral-Orange Circle -->
  <circle cx="40" cy="40" r="17" fill="#FF5722" />
  
  <!-- 100% Mathematically Symmetrical White Medical Cross -->
  <rect x="37.5" y="32.5" width="5" height="15" rx="2" fill="#FFFFFF" />
  <rect x="32.5" y="37.5" width="15" height="5" rx="2" fill="#FFFFFF" />

  <!-- Number Value (1) -->
  <text x="78" y="41" class="font-inter" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.5">1</text>

  <!-- Label (TOTAL SAKIT) -->
  <text x="78" y="59" class="font-inter" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.4">TOTAL SAKIT</text>
</svg>
