<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 88" width="210" height="88">
  <defs>
    <!-- Soft Ambient Elevation Shadow -->
    <filter id="shadow-cuti" x="-8%" y="-12%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
  </defs>

  <style>
    .font-inter {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Card Background Surface -->
  <rect x="5" y="4" width="200" height="80" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow-cuti)" />

  <!-- Squircle Container (Soft Tint) -->
  <rect x="16" y="16" width="48" height="48" rx="14" ry="14" fill="#F2EBFD" />

  <!-- Gojek Style: Symmetrical Solid Violet Circle -->
  <circle cx="40" cy="40" r="17" fill="#7C3AED" />
  
  <!-- Symmetrical White Vacation Suitcase in Center -->
  <rect x="33" y="34.5" width="14" height="11" rx="2.5" fill="#FFFFFF" />
  <path d="M37.5 34.5v-2.2a1.5 1.5 0 0 1 1.5-1.5h2a1.5 1.5 0 0 1 1.5 1.5v2.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <line x1="40" y1="36.5" x2="40" y2="43.5" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" />
  <circle cx="35.5" cy="46" r="1" fill="#FFFFFF" />
  <circle cx="44.5" cy="46" r="1" fill="#FFFFFF" />

  <!-- Number Value (0) -->
  <text x="78" y="41" class="font-inter" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.5">0</text>

  <!-- Label (TOTAL CUTI) -->
  <text x="78" y="59" class="font-inter" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.4">TOTAL CUTI</text>
</svg>
